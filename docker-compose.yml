services:
  talky-postgres18:
    image: postgres:18
    container_name: talkyapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: talky
      POSTGRES_PASSWORD: talky
      POSTGRES_DB: talkydb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  talky-valkey:
    image: valkey/valkey:8
    container_name: talkyapp-valkey
    restart: unless-stopped
    ports:
      - "6379:6379"
volumes:
  postgres_data: